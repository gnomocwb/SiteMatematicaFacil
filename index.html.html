<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabuada Amiga / Friendly Times Tables</title>
    <!-- Fonte suave e arredondada, excelente para dislexia e neurodivergentes -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS para estilização rápida -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Quicksand', 'sans-serif'],
                    },
                    colors: {
                        nature: {
                            50: '#f2fbf5',
                            100: '#e0f6e7',
                            200: '#c2ebd2',
                            300: '#94d8b2',
                            400: '#5ebb8a',
                            500: '#399d6c',
                            600: '#287c53',
                            700: '#226344',
                            800: '#1e4f38',
                            900: '#19412f',
                        },
                        sand: {
                            100: '#fdfbf7',
                            200: '#f5efe6',
                            300: '#e8dac1',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #fdfbf7;
            color: #1e4f38;
            user-select: none; /* Evita seleção acidental de texto */
        }
        .btn-soft {
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        .btn-soft:active {
            transform: translateY(2px);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .leaf-icon {
            font-size: 1.5rem;
            display: inline-block;
            margin: 2px;
        }
        .tree-icon {
            font-size: 4.5rem; /* Árvores maiores */
            display: inline-block;
            margin: 0 5px;
            transform-origin: bottom;
            animation: growTree 1.5s ease-out;
            z-index: 10;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Estilos do Jardim */
        .garden-container {
            position: relative;
            height: 220px;
            width: 100%;
            border-bottom: 6px solid #5ebb8a;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 10px;
            overflow: hidden;
            padding-bottom: 2px;
                    }
        .plant {
            font-size: 3rem;
            transform-origin: bottom;
            animation: grow 1s ease-out;
            z-index: 5;
        }
        @keyframes grow {
            from { transform: scaleY(0); }
            to { transform: scaleY(1); }
        }
        @keyframes growTree {
            from { transform: scaleY(0) scaleX(0.8); opacity: 0; }
            to { transform: scaleY(1) scaleX(1); opacity: 1; }
        }
        
        /* Indicador de progresso */
        .progress-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #c2ebd2;
            transition: background-color 0.3s ease;
        }
        .progress-dot.filled {
            background-color: #399d6c;
        }
        .progress-dot.current {
            background-color: #94d8b2;
            transform: scale(1.3);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navbar / Controles -->
    <header class="bg-nature-100 p-4 flex justify-between items-center shadow-sm">
        <h1 class="text-2xl font-bold text-nature-700 flex items-center gap-2" id="app-title">
            <span>🌱</span> Tabuada Amiga
        </h1>
        <div class="flex gap-4">
            <button id="btn-lang" class="bg-white px-4 py-2 rounded-full text-nature-700 font-semibold btn-soft border border-nature-200 hover:bg-nature-50">
                PT/EN
            </button>
            <button id="btn-mute" class="bg-white px-4 py-2 rounded-full text-nature-700 font-semibold btn-soft border border-nature-200 hover:bg-nature-50">
                🔊 <span id="mute-text">Som Ligado</span>
            </button>
            <button id="btn-home" class="bg-nature-500 text-white px-4 py-2 rounded-full font-semibold btn-soft hidden hover:bg-nature-600">
                🏠 <span id="home-text">Início</span>
            </button>
        </div>
    </header>

    <!-- Área Principal -->
    <main class="flex-grow flex flex-col items-center justify-center p-6 w-full max-w-5xl mx-auto relative">
        
        <!-- TELA 1: Menu de Seleção -->
        <div id="screen-menu" class="w-full fade-in flex flex-col items-center">
            
            <h2 class="text-3xl font-bold text-nature-600 mb-2 text-center" id="menu-title">Qual tabuada vamos explorar hoje?</h2>
            <p class="text-nature-500 mb-6 text-center" id="menu-subtitle">Pratique repetições e plante flores.</p>
            
            <!-- Botões Tabuada 1 a 10 -->
            <div class="grid grid-cols-5 md:grid-cols-10 gap-3 w-full mb-8">
                <div id="table-buttons" class="contents"></div>
            </div>

            <div class="w-full h-px bg-nature-200 mb-8"></div>

            <!-- Fases / Testes (NOVIDADE) -->
            <h2 class="text-2xl font-bold text-nature-600 mb-2 text-center" id="test-title">Aventura Matemática</h2>
            <p class="text-nature-500 mb-6 text-center" id="test-subtitle">Faça 70% de acertos para plantar Grandes Árvores!</p>
            
            <div class="grid grid-cols-1 md:grid-cols-5 gap-4 w-full">
                <button onclick="startTest(1)" class="bg-white border-2 border-nature-300 text-nature-700 font-bold py-4 rounded-2xl btn-soft hover:bg-nature-50 flex flex-col items-center gap-2">
                    <span class="text-2xl">➕</span>
                    <span id="txt-phase1">Fase 1: Adição</span>
                </button>
                <button onclick="startTest(2)" class="bg-white border-2 border-nature-300 text-nature-700 font-bold py-4 rounded-2xl btn-soft hover:bg-nature-50 flex flex-col items-center gap-2">
                    <span class="text-2xl">➖</span>
                    <span id="txt-phase2">Fase 2: Subtração</span>
                </button>
                <button onclick="startTest(3)" class="bg-white border-2 border-nature-300 text-nature-700 font-bold py-4 rounded-2xl btn-soft hover:bg-nature-50 flex flex-col items-center gap-2">
                    <span class="text-2xl">✖️</span>
                    <span id="txt-phase3">Fase 3: Multiplicação</span>
                </button>
                <button onclick="startTest(4)" class="bg-white border-2 border-nature-300 text-nature-700 font-bold py-4 rounded-2xl btn-soft hover:bg-nature-50 flex flex-col items-center gap-2">
                    <span class="text-2xl">➗</span>
                    <span id="txt-phase4">Fase 4: Divisão</span>
                </button>
                <button onclick="startTest(5)" class="bg-nature-500 text-white border-2 border-nature-600 font-bold py-4 rounded-2xl btn-soft hover:bg-nature-600 flex flex-col items-center gap-2">
                    <span class="text-2xl">🌟</span>
                    <span id="txt-phase5">Fase 5: Mistura</span>
                </button>
            </div>

            <!-- Mini Jardim no Menu -->
            <div class="mt-12 w-full max-w-4xl text-center">
                <h3 class="text-lg text-nature-700 mb-2 font-semibold" id="garden-title">Seu Jardim Mágico</h3>
                <div id="main-garden" class="garden-container bg-nature-50 rounded-t-3xl shadow-inner">
                    <!-- Plantas e Árvores crescem aqui -->
                </div>
            </div>
        </div>

        <!-- TELA 2: Exercício / Teste -->
        <div id="screen-quiz" class="w-full fade-in hidden flex-col items-center">
            
            <!-- Barra de Progresso (usada apenas nos testes) -->
            <div id="progress-container" class="hidden w-full max-w-2xl flex justify-between mb-6 px-4">
                <!-- Bolinhas geradas via JS -->
            </div>

            <div class="bg-white rounded-3xl shadow-sm border border-sand-200 p-8 w-full max-w-2xl flex flex-col items-center relative">
                
                <h2 class="text-5xl font-bold text-nature-700 mb-6 text-center tracking-wide" id="question-text">3 + 4 = ?</h2>
                
                <!-- Representação Visual Suave -->
                <div id="visual-representation" class="bg-nature-50 p-6 rounded-2xl w-full mb-8 flex flex-col gap-4 items-center justify-center min-h-[120px]">
                    <!-- Exemplo visual gerado no JS -->
                </div>

                <!-- Opções de Resposta (3 opções) -->
                <div id="options-container" class="flex flex-col md:flex-row gap-6 w-full justify-center">
                    <!-- Botões gerados no JS -->
                </div>

                <!-- Feedback (Mensagem positiva/suave) -->
                <div id="feedback-message" class="mt-8 text-2xl font-bold text-center h-10 opacity-0 transition-opacity duration-300">
                    <!-- Texto de feedback -->
                </div>

            </div>

            <!-- Botão Próximo -->
            <button id="btn-next" class="mt-8 bg-nature-500 text-white px-10 py-4 rounded-full text-xl font-bold btn-soft hidden hover:bg-nature-600">
                <span id="next-text">Próxima Folhinha</span> ➡️
            </button>
        </div>

        <!-- TELA 3: Recompensa Geral -->
        <div id="screen-reward" class="w-full fade-in hidden flex-col items-center">
            <h2 class="text-4xl font-bold text-nature-700 mb-4 text-center" id="reward-title">Seu jardim está crescendo!</h2>
            <p class="text-xl text-nature-600 mb-8 text-center" id="reward-subtitle">Você plantou uma nova flor.</p>
            
            <div id="reward-emoji" class="text-9xl mb-10 plant">
                🌻
            </div>

            <button id="btn-reward-ok" class="bg-nature-600 text-white px-10 py-4 rounded-2xl text-xl font-bold btn-soft hover:bg-nature-700">
                <span id="reward-btn-text">Continuar Explorando</span>
            </button>
        </div>

    </main>

    <script>
        // --- DICIONÁRIO DE IDIOMAS (PT/EN) ---
        const i18n = {
            pt: {
                appTitle: "Tabuada Amiga",
                soundOn: "Som Ligado",
                soundOff: "Som Desligado",
                home: "Início",
                menuTitle: "Qual tabuada vamos explorar?",
                menuSubtitle: "Pratique e plante lindas flores.",
                testTitle: "Aventura Matemática",
                testSubtitle: "Acerte 7 ou mais para plantar Grandes Árvores!",
                phases: ["Fase 1: Adição", "Fase 2: Subtração", "Fase 3: Multiplicação", "Fase 4: Divisão", "Fase 5: Mistura"],
                gardenTitle: "Seu Jardim Mágico",
                opWords: {'+': 'mais', '-': 'menos', 'x': 'vezes', '/': 'dividido por'},
                questionFormat: (a, op, b) => `Quanto é ${a} ${i18n.pt.opWords[op]} ${b}?`,
                correct: ["Muito bem!", "Isso mesmo!", "Você conseguiu!", "Lindo!"],
                retry: ["Vamos ver juntos?", "Tudo bem, tente outra.", "Olhe as folhinhas e tente novamente."],
                next: "Próxima",
                rewardTitleFlower: "O Jardim Cresceu!",
                rewardSubFlower: "Você ganhou uma nova flor com seu esforço.",
                rewardTitleTree: "Incrível! Uma Grande Árvore!",
                rewardSubTree: "Você acertou bastante e plantou uma árvore linda!",
                rewardTitleWater: "Bom Treino!",
                rewardSubWater: "O jardim adorou a água. Vamos tentar de novo para a árvore crescer?",
                rewardBtn: "Continuar Explorando",
                plants: ["🌷", "🌼", "🌻", "🌺", "🌾"],
                trees: ["🌳", "🌲", "🌴", "🌳", "🌲"]
            },
            en: {
                appTitle: "Friendly Tables",
                soundOn: "Sound On",
                soundOff: "Sound Off",
                home: "Home",
                menuTitle: "Which table shall we explore?",
                menuSubtitle: "Practice and plant beautiful flowers.",
                testTitle: "Math Adventure",
                testSubtitle: "Score 7 or more to plant Big Trees!",
                phases: ["Phase 1: Addition", "Phase 2: Subtraction", "Phase 3: Multiplication", "Phase 4: Division", "Phase 5: Mixed"],
                gardenTitle: "Your Magic Garden",
                opWords: {'+': 'plus', '-': 'minus', 'x': 'times', '/': 'divided by'},
                questionFormat: (a, op, b) => `How much is ${a} ${i18n.en.opWords[op]} ${b}?`,
                correct: ["Well done!", "That's right!", "You got it!", "Beautiful!"],
                retry: ["Let's look together?", "It's okay, try another.", "Count the leaves and try again."],
                next: "Next",
                rewardTitleFlower: "The Garden Grew!",
                rewardSubFlower: "You earned a new flower with your effort.",
                rewardTitleTree: "Amazing! A Big Tree!",
                rewardSubTree: "You got a great score and planted a beautiful tree!",
                rewardTitleWater: "Good Practice!",
                rewardSubWater: "The garden loved the water. Let's try again to grow a tree?",
                rewardBtn: "Keep Exploring",
                plants: ["🌷", "🌼", "🌻", "🌺", "🌾"],
                trees: ["🌳", "🌲", "🌴", "🌳", "🌲"]
            }
        };

        // --- ESTADO DO APP ---
        let currentLang = 'pt';
        let isMuted = false;
        
        let gardenScore = 0; // Quantas flores
        let treeScore = 0;   // Quantas árvores (Testes)
        
        // Controle de Estado do Jogo
        let isTestMode = false;
        let currentTestPhase = 0;
        let currentTable = null; // 1-10
        
        // Controle de Perguntas
        let currentQuestion = { a: 0, b: 0, op: 'x', answer: 0 };
        let questionCount = 0; // Para tabuada normal (a cada 5 ganha flor)
        let testQuestionIndex = 0; // De 0 a 9 (10 questões)
        let testCorrectCount = 0;

        // --- AUDIO SYSTEM (Sensorial e Brando) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, type, duration, vol) {
            if (isMuted) return;
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playCorrectSound() {
            playTone(523.25, 'sine', 1.5, 0.1); // C5
            setTimeout(() => playTone(659.25, 'sine', 1.5, 0.1), 100); // E5
            setTimeout(() => playTone(783.99, 'sine', 2.0, 0.1), 200); // G5
        }

        function playRetrySound() {
            playTone(261.63, 'sine', 0.8, 0.05); // C4 (Som de gota grave)
        }
        
        function playVictorySound() {
            // Arpejo mais longo para recompensa da árvore
            playTone(523.25, 'sine', 2.0, 0.1); 
            setTimeout(() => playTone(659.25, 'sine', 2.0, 0.1), 150); 
            setTimeout(() => playTone(783.99, 'sine', 2.0, 0.1), 300); 
            setTimeout(() => playTone(1046.50, 'sine', 3.0, 0.1), 450); 
        }

        // --- TEXT TO SPEECH ---
        function speak(text) {
            if (isMuted) return;
            window.speechSynthesis.cancel(); 
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = currentLang === 'pt' ? 'pt-BR' : 'en-US';
            utterance.rate = 0.85; // Calmo e devagar
            utterance.pitch = 1.1;
            window.speechSynthesis.speak(utterance);
        }

        // --- NAVEGAÇÃO ---
        const screens = {
            menu: document.getElementById('screen-menu'),
            quiz: document.getElementById('screen-quiz'),
            reward: document.getElementById('screen-reward')
        };

        function showScreen(screenName) {
            Object.values(screens).forEach(s => s.classList.add('hidden'));
            screens[screenName].classList.remove('hidden');
            
            const btnHome = document.getElementById('btn-home');
            if (screenName === 'menu') {
                btnHome.classList.add('hidden');
                updateGardenDisplay();
            } else {
                btnHome.classList.remove('hidden');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateUI() {
            const t = i18n[currentLang];
            document.getElementById('app-title').innerHTML = `<span>🌱</span> ${t.appTitle}`;
            document.getElementById('mute-text').innerText = isMuted ? t.soundOff : t.soundOn;
            document.getElementById('btn-mute').innerHTML = isMuted ? `🔇 <span id="mute-text">${t.soundOff}</span>` : `🔊 <span id="mute-text">${t.soundOn}</span>`;
            document.getElementById('home-text').innerText = t.home;
            
            document.getElementById('menu-title').innerText = t.menuTitle;
            document.getElementById('menu-subtitle').innerText = t.menuSubtitle;
            
            document.getElementById('test-title').innerText = t.testTitle;
            document.getElementById('test-subtitle').innerText = t.testSubtitle;
            
            for(let i=1; i<=5; i++) {
                document.getElementById(`txt-phase${i}`).innerText = t.phases[i-1];
            }
            
            document.getElementById('garden-title').innerText = t.gardenTitle;
            document.getElementById('next-text').innerText = t.next;
            document.getElementById('reward-btn-text').innerText = t.rewardBtn;

            generateMenuButtons();
            updateGardenDisplay();
        }

        function toggleLang() {
            currentLang = currentLang === 'pt' ? 'en' : 'pt';
            updateUI();
        }

        function toggleMute() {
            isMuted = !isMuted;
            if(!isMuted) initAudio();
            updateUI();
        }

        function generateMenuButtons() {
            const container = document.getElementById('table-buttons');
            container.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                const btn = document.createElement('button');
                btn.className = 'bg-white text-nature-700 text-xl font-bold py-3 rounded-2xl border-2 border-nature-200 btn-soft hover:bg-nature-50';
                btn.innerText = i;
                btn.onclick = () => startQuiz(i);
                container.appendChild(btn);
            }
        }

        function updateGardenDisplay() {
            const garden = document.getElementById('main-garden');
            garden.innerHTML = '';
            const t = i18n[currentLang];
            
            if (gardenScore === 0 && treeScore === 0) {
                garden.innerHTML = `<span class="text-nature-300 text-sm mb-2">...</span>`;
                return;
            }

            // Renderiza Flores
            for (let i = 0; i < gardenScore; i++) {
                const plant = document.createElement('div');
                plant.className = 'plant';
                plant.innerText = t.plants[i % t.plants.length];
                garden.appendChild(plant);
            }

            // Renderiza Árvores
            for (let i = 0; i < treeScore; i++) {
                const tree = document.createElement('div');
                tree.className = 'tree-icon';
                tree.innerText = t.trees[i % t.trees.length];
                // Inserir árvores intercaladas ou no final
                garden.insertBefore(tree, garden.firstChild);
            }
        }

        // --- GERAÇÃO DE PERGUNTAS ---
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function getQuestionData() {
            let a, b, answer, op;

            if (!isTestMode) {
                // Tabuada Normal (Sempre Multiplicação)
                a = currentTable;
                b = getRandomInt(1, 10);
                op = 'x';
                answer = a * b;
            } else {
                // Modo Teste / Aventura
                const ops = ['+', '-', 'x', '/'];
                op = ops[0];
                
                if(currentTestPhase === 1) op = '+';
                else if (currentTestPhase === 2) op = '-';
                else if (currentTestPhase === 3) op = 'x';
                else if (currentTestPhase === 4) op = '/';
                else op = ops[getRandomInt(0, 3)]; // Misturado

                if (op === '+') { 
                    // Fáceis: soma até 20
                    a = getRandomInt(1, 10); 
                    b = getRandomInt(1, 10); 
                    answer = a + b; 
                }
                else if (op === '-') { 
                    // Resultado sempre positivo
                    b = getRandomInt(1, 10); 
                    answer = getRandomInt(1, 10); 
                    a = b + answer; 
                } 
                else if (op === 'x') { 
                    // Fáceis: até 5x5 ou 10x2
                    a = getRandomInt(1, 5); 
                    b = getRandomInt(1, 5); 
                    answer = a * b; 
                }
                else if (op === '/') { 
                    // Divisão exata fácil
                    b = getRandomInt(1, 5); 
                    answer = getRandomInt(1, 5); 
                    a = b * answer; 
                }
            }
            return { a, b, op, answer };
        }

        // --- INÍCIO DOS MODOS ---
        
        // Tabuada 1-10
        function startQuiz(tableNumber) {
            initAudio(); 
            isTestMode = false;
            currentTable = tableNumber;
            questionCount = 0;
            document.getElementById('progress-container').classList.add('hidden');
            showScreen('quiz');
            nextQuestion();
        }

        // Testes de 1 a 5
        function startTest(phase) {
            initAudio();
            isTestMode = true;
            currentTestPhase = phase;
            testQuestionIndex = 0;
            testCorrectCount = 0;
            
            // Renderiza bolinhas de progresso
            const prog = document.getElementById('progress-container');
            prog.innerHTML = '';
            for(let i=0; i<10; i++) {
                const dot = document.createElement('div');
                dot.className = 'progress-dot';
                dot.id = `dot-${i}`;
                prog.appendChild(dot);
            }
            prog.classList.remove('hidden');

            showScreen('quiz');
            nextQuestion();
        }

        function updateProgressDots() {
            if(!isTestMode) return;
            for(let i=0; i<10; i++) {
                const dot = document.getElementById(`dot-${i}`);
                dot.classList.remove('current');
                if (i < testQuestionIndex) {
                    dot.classList.add('filled');
                } else if (i === testQuestionIndex) {
                    dot.classList.add('current');
                }
            }
        }

        function nextQuestion() {
            document.getElementById('feedback-message').style.opacity = '0';
            document.getElementById('btn-next').classList.add('hidden');
            document.getElementById('options-container').innerHTML = '';
            
            updateProgressDots();
            currentQuestion = getQuestionData();
            
            // Formatando o símbolo matemático visualmente
            let displayOp = currentQuestion.op;
            if (displayOp === '/') displayOp = '÷';

            // Renderiza Texto
            document.getElementById('question-text').innerText = `${currentQuestion.a} ${displayOp} ${currentQuestion.b} = ?`;
            
            // Narra
            const t = i18n[currentLang];
            speak(t.questionFormat(currentQuestion.a, currentQuestion.op, currentQuestion.b));

            renderVisualRepresentation(currentQuestion.a, currentQuestion.b, currentQuestion.op);

            // Renderiza Opções (3 alternativas)
            const options = generateOptions(currentQuestion.answer);
            const optionsContainer = document.getElementById('options-container');
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'bg-white border-2 border-nature-200 text-nature-700 text-4xl font-bold py-6 px-10 rounded-2xl btn-soft hover:bg-nature-50 w-full md:w-auto shadow-sm';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function renderVisualRepresentation(a, b, op) {
            const container = document.getElementById('visual-representation');
            container.innerHTML = '';
            
            // Evita sobrecarga visual para números muito grandes
            if (a > 15 || b > 15) {
                container.innerHTML = `<p class="text-nature-500 font-semibold text-lg">🌸 Mente focada! 🌸</p>`;
                return;
            }

            if (op === 'x') {
                for (let i = 0; i < a; i++) {
                    const group = document.createElement('div');
                    group.className = 'flex flex-wrap gap-1 bg-white p-2 rounded-xl border border-nature-100 shadow-sm';
                    for (let j = 0; j < b; j++) {
                        group.innerHTML += `<span class="leaf-icon">🍃</span>`;
                    }
                    container.appendChild(group);
                }
            } else if (op === '+') {
                const wrapper = document.createElement('div');
                wrapper.className = 'flex items-center gap-4';
                
                let g1 = `<div class="flex flex-wrap gap-1 bg-white p-2 rounded-xl border border-nature-100 w-fit">`;
                for(let i=0; i<a; i++) g1 += `<span class="leaf-icon">🍃</span>`;
                g1 += `</div>`;

                let g2 = `<div class="flex flex-wrap gap-1 bg-white p-2 rounded-xl border border-nature-100 w-fit">`;
                for(let i=0; i<b; i++) g2 += `<span class="leaf-icon">🍃</span>`;
                g2 += `</div>`;

                wrapper.innerHTML = `${g1} <span class="text-3xl font-bold text-nature-400">+</span> ${g2}`;
                container.appendChild(wrapper);
            } else if (op === '-') {
                const wrapper = document.createElement('div');
                wrapper.className = 'flex flex-col items-center gap-2 bg-white p-3 rounded-xl border border-nature-100 shadow-sm';
                let html = '<div class="flex flex-wrap gap-1 max-w-[250px] justify-center">';
                // Mostra o total (a), sendo b com opacidade menor simulando a retirada
                for(let i=0; i<a; i++) {
                    if (i < b) {
                        html += `<span class="leaf-icon opacity-30 grayscale">🍃</span>`;
                    } else {
                        html += `<span class="leaf-icon">🍃</span>`;
                    }
                }
                html += '</div>';
                wrapper.innerHTML = html;
                container.appendChild(wrapper);
            } else {
                // Divisão: Simplificado para não confundir
                container.innerHTML = `<p class="text-nature-500 font-semibold text-lg">Agrupando sementes...</p>`;
            }
        }

        function generateOptions(correctAnswer) {
            const options = [correctAnswer];
            while (options.length < 3) {
                const offset = Math.floor(Math.random() * 4) + 1;
                const sign = Math.random() > 0.5 ? 1 : -1;
                const fakeAns = Math.max(0, correctAnswer + (offset * sign)); // Nao permite negativos nas respostas
                if (!options.includes(fakeAns)) {
                    options.push(fakeAns);
                }
            }
            return options.sort(() => Math.random() - 0.5);
        }

        function checkAnswer(selected, buttonElement) {
            const t = i18n[currentLang];
            const feedbackBox = document.getElementById('feedback-message');
            const allButtons = document.getElementById('options-container').querySelectorAll('button');

            if (selected === currentQuestion.answer) {
                // ACERTO
                playCorrectSound();
                buttonElement.classList.replace('bg-white', 'bg-nature-400');
                buttonElement.classList.replace('text-nature-700', 'text-white');
                buttonElement.classList.remove('border-nature-200');
                
                allButtons.forEach(b => b.disabled = true);
                
                const msg = t.correct[Math.floor(Math.random() * t.correct.length)];
                feedbackBox.innerText = msg;
                feedbackBox.className = "mt-8 text-2xl font-bold text-center h-10 transition-opacity duration-300 text-nature-600";
                feedbackBox.style.opacity = '1';
                speak(msg);

                document.getElementById('btn-next').classList.remove('hidden');
                
                if (isTestMode) testCorrectCount++;
                else questionCount++;

            } else {
                // ERRO - Feedback positivo
                playRetrySound();
                buttonElement.style.opacity = '0.4';
                buttonElement.disabled = true;

                const msg = t.retry[Math.floor(Math.random() * t.retry.length)];
                feedbackBox.innerText = msg;
                feedbackBox.className = "mt-8 text-xl font-semibold text-center h-10 transition-opacity duration-300 text-sand-700";
                feedbackBox.style.opacity = '1';
                speak(msg);
            }
        }

        // Lida com o clique no botão Próximo
        document.getElementById('btn-next').addEventListener('click', () => {
            const t = i18n[currentLang];

            if (!isTestMode) {
                // Modo Tabuada Normal: Recompensa de Flor a cada 5
                if (questionCount >= 5) { 
                    gardenScore++;
                    document.getElementById('reward-title').innerText = t.rewardTitleFlower;
                    document.getElementById('reward-subtitle').innerText = t.rewardSubFlower;
                    document.getElementById('reward-emoji').innerText = t.plants[Math.floor(Math.random() * t.plants.length)];
                    document.getElementById('reward-emoji').className = "text-9xl mb-10 plant";
                    showScreen('reward');
                    playVictorySound();
                } else {
                    nextQuestion();
                }
            } else {
                // Modo Teste
                testQuestionIndex++;
                if (testQuestionIndex >= 10) {
                    // Fim do teste
                    if (testCorrectCount >= 7) {
                        treeScore++;
                        document.getElementById('reward-title').innerText = t.rewardTitleTree;
                        document.getElementById('reward-subtitle').innerText = t.rewardSubTree;
                        document.getElementById('reward-emoji').innerText = t.trees[Math.floor(Math.random() * t.trees.length)];
                        document.getElementById('reward-emoji').className = "text-9xl mb-10 tree-icon"; // Usa classe da árvore
                        playVictorySound();
                    } else {
                        document.getElementById('reward-title').innerText = t.rewardTitleWater;
                        document.getElementById('reward-subtitle').innerText = t.rewardSubWater;
                        document.getElementById('reward-emoji').innerText = "💧";
                        document.getElementById('reward-emoji').className = "text-9xl mb-10 fade-in";
                        playCorrectSound(); // Som apenas encorajador
                    }
                    showScreen('reward');
                } else {
                    nextQuestion();
                }
            }
        });

        document.getElementById('btn-reward-ok').addEventListener('click', () => {
            showScreen('menu');
        });

        // Eventos dos botões da Navbar
        document.getElementById('btn-lang').addEventListener('click', toggleLang);
        document.getElementById('btn-mute').addEventListener('click', toggleMute);
        document.getElementById('btn-home').addEventListener('click', () => showScreen('menu'));

        // Inicia
        updateUI();
    </script>
</body>
</html>
